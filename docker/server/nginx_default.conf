server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/upload {
        add_header Content-Type application/json;
        return 200 '{"status":"received","message":"POST request accepted"}';
    }

    location /api/status {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"cnc-server"}';
    }
}
